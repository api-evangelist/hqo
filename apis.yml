name: HqO
description: >-
  HqO is a Boston-based proptech company whose Real Estate Experience (REX)
  Platform helps commercial real estate owners, operators, and asset managers
  bridge the "experience gap" for the tenants and employees who occupy their
  buildings. The platform spans six integrated suites — Intelligence, Experience,
  Tenant, Operations, Leasing, and Vendor — covering AI-powered portfolio
  analytics, mobile tenant apps, amenity and space booking, access control, a
  cloud building management system, leasing engagement, and vendor management.
  HqO manages more than 150 million square feet of real estate for landlords such
  as JLL, Hines, Vornado, Gecina, and Alexandria Real Estate. Programmatic
  integration is available through APIs and SDKs offered under an Enterprise
  Development engagement rather than a self-serve public developer portal; the
  platform also supports SSO (SAML), webview, deep-link, and native integrations.
